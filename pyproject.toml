[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-genius"
version = "0.1.0"
description = "Ticket Genius - Ticketing platform aggregating events from Ticketmaster"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.3",
    "invoke==3.0.3",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "SQLAlchemy==2.0.52",
    "watchfiles==1.2.0",
    "marshmallow==3.26.1",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "redis==6.2.0",
    "httpx==0.28.1",
    "alembic==1.16.1",
    "python-dependency-injector==4.49.0",
    "structlog==25.4.0",
    "prometheus-client==0.21.1",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-instrumentation-flask==0.49b0",
    "opentelemetry-instrumentation-requests==0.49b0",
    "opentelemetry-instrumentation-sqlalchemy==0.49b0",
    "opentelemetry-exporter-otlp==1.29.0",
    "testcontainers==4.13.1",
    "respx==0.23.3",
    "schemathesis==2025.6.0",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "ruff==0.12.0",
    "mypy==1.15.0",
    "types-requests==2.34.2",
    "types-PyYAML==6.0.12",
    "pre-commit==4.0.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "ARG", # flake8-unused-arguments
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default args (acceptable in tests)
    "ARG001", # unused argument (common in handlers)
    "ARG002", # unused argument (common in handlers)
    "TRY003", # bare except (acceptable in shutdown handlers)
]
per-file-ignores = { "tests/**/*.py" = ["ARG001", "ARG002", "S101"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_ignores = true
implicit_optional = true
strict_optional = true
enable_error_code = [
    "attr-defined",
    "assignment",
    "return",
    "union-attr",
]
ignore_missing_imports = true
exclude = ["tests/**", "migrations/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["domain", "service_layer", "adapters", "entrypoints", "cli", "observability"]
omit = ["tests/**", "migrations/**"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]